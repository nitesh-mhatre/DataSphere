[project]
name = "dataspear"
version = "0.1.0"
description = "Lightweight async NSE/Groww/Yahoo data layer for Indian markets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[install-setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["dataspear*"]
